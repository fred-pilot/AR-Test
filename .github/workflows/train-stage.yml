name: Trainingsetappe

on:
  workflow_call:
    inputs:
      stage:
        type: number
        required: true
      # GitHub-Ausdrücke können nicht rechnen, darum wird die vorige Etappe mitgegeben (0 = keine).
      previous:
        type: number
        required: true

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        # standard ist schneller fertig, extended erkennt und verfolgt genauer (empfohlen für trackingObjects).
        mode: [standard, extended]
    runs-on: xcode-27
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Stand der vorigen Etappe holen
        if: inputs.previous > 0
        uses: actions/download-artifact@v4
        with:
          name: state-${{ matrix.mode }}-${{ inputs.previous }}
          path: state

      # Create ML braucht im Modus extended mindestens 43 GB freien Platz, mehr als der Runner von Haus aus hat.
      - name: Speicherplatz freiräumen
        run: |
          df -h /
          xcrun simctl shutdown all 2>/dev/null || true
          xcrun simctl delete all 2>/dev/null || true
          xcrun simctl runtime delete all 2>/dev/null || true
          active=$(dirname "$(dirname "$(xcode-select -p)")")
          for app in /Applications/Xcode*.app; do
            real=$(cd "$app" && pwd -P)
            [ "$real" = "$(cd "$active" && pwd -P)" ] || sudo rm -rf "$app"
          done
          sudo rm -rf ~/Library/Android ~/.android ~/.dotnet /usr/local/share/dotnet \
            ~/hostedtoolcache /Users/runner/hostedtoolcache ~/Library/Developer/CoreSimulator/Caches \
            ~/Library/Caches/com.apple.dt.* /Library/Developer/CoreSimulator/Images 2>/dev/null || true
          df -h /

      - name: Trainieren (höchstens 5,5 Stunden)
        id: train
        run: |
          mkdir -p state/checkpoint
          if [ -f state/ToyCar.referenceobject ]; then
            echo "Schon in einer früheren Etappe fertig geworden."
            exit 0
          fi
          xcodebuild -version

          xcrun createml objecttracker \
            --training-mode "${{ matrix.mode }}" --upright \
            --source training/ToyCar_training.usdz \
            --output state/ToyCar.referenceobject \
            --checkpoint state/checkpoint \
            --summary --csv-progress --csv-fd 4 4>>state/progress.csv &
          pid=$!
          # Vor dem 6-Stunden-Limit sauber anhalten, damit der Checkpoint hochgeladen werden kann.
          ( sleep 19800; echo "Zeit für diese Etappe um, halte an."; kill -INT "$pid" 2>/dev/null ) &
          watchdog=$!
          ( while kill -0 "$pid" 2>/dev/null; do sleep 600; echo "Fortschritt: $(tail -n 1 state/progress.csv 2>/dev/null)"; done ) &
          set +e
          wait "$pid"
          code=$?
          set -e
          kill "$watchdog" 2>/dev/null || true
          echo "createml beendet mit Code $code"
          # 130 = von uns wegen des Zeitlimits angehalten, dann geht es in der nächsten Etappe weiter.
          if [ "$code" -ne 0 ] && [ "$code" -ne 130 ] && [ ! -f state/ToyCar.referenceobject ]; then
            exit "$code"
          fi
          if [ -f state/ToyCar.referenceobject ]; then
            echo "finished=true" >> "$GITHUB_OUTPUT"
            ls -l state/ToyCar.referenceobject
          fi

      - name: Stand für die nächste Etappe sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ matrix.mode }}-${{ inputs.stage }}
          path: state
          include-hidden-files: true
          retention-days: 3

      - name: Fertiges Referenzobjekt hochladen
        if: steps.train.outputs.finished == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ToyCar-${{ matrix.mode }}
          path: |
            state/ToyCar.referenceobject
            state/progress.csv
          retention-days: 30
