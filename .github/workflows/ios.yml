name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Xcode 27 mit iOS-27-SDK, nötig für die Objektverfolgung (trackingObjects).
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      # Unsigniert bauen – signiert wird erst beim Installieren (Sideloadly/AltStore mit deiner Apple-ID).
      - name: IPA bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OffroadAR-${{ github.run_number }}
          path: build/OffroadAR.ipa
          retention-days: 14
