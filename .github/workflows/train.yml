name: Objekterkennung trainieren

# Trainiert aus training/ToyCar_training.usdz das Referenzobjekt, mit dem die App das Auto erkennt.
# Das dauert mehrere Stunden. Ein GitHub-Job darf höchstens 6 Stunden laufen, deshalb geht das Training
# in Etappen: Jede Etappe macht am Checkpoint der vorigen weiter. Ist das Training fertig, laufen die
# restlichen Etappen nur noch kurz durch. Ergebnis: Artifacts „ToyCar-standard“ und „ToyCar-extended“.
on:
  workflow_dispatch:
  push:
    paths:
      - training/ToyCar_training.usdz
      - .github/workflows/train.yml
      - .github/workflows/train-stage.yml

jobs:
  stage1:
    uses: ./.github/workflows/train-stage.yml
    with: { stage: 1, previous: 0 }
  stage2:
    needs: stage1
    uses: ./.github/workflows/train-stage.yml
    with: { stage: 2, previous: 1 }
  stage3:
    needs: stage2
    uses: ./.github/workflows/train-stage.yml
    with: { stage: 3, previous: 2 }
  stage4:
    needs: stage3
    uses: ./.github/workflows/train-stage.yml
    with: { stage: 4, previous: 3 }
