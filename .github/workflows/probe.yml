name: probe
on:
  push:
    branches: [feature/auto-tracking]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          H=$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/ARKit.framework/Headers
          echo "=== ARReferenceObject.h"; cat "$H/ARReferenceObject.h"
          echo "=== ARObjectAnchor.h"; cat "$H/ARObjectAnchor.h"
          echo "=== ARConfiguration.h detection/tracking"; grep -n -B3 -A25 'detectionObjects' "$H/ARConfiguration.h" | head -200
          echo "=== ARConfiguration.h scanning"; grep -n -A40 'interface ARObjectScanningConfiguration' "$H/ARConfiguration.h"
          echo "=== ARSession.h"; grep -n -B12 -A6 'createReferenceObject' "$H/ARSession.h"
          echo "=== grep arobject"; grep -rn -i 'arobject\|referenceobject' "$H" | head -60
          echo "=== ARTrackable"; grep -rn -B4 -A8 'isTracked' "$H/ARTrackable.h" "$H/ARAnchor.h" | head -60
